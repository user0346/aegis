<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AEGIS</title>
<link rel="stylesheet" href="hud.css">
<style>
  /* Boot-Screen — eigenes Layout */
  .boot { position: relative; z-index: 1; height: 100vh; display: grid; place-items: center; padding: 24px; }
  .boot .col { width: 100%; max-width: 440px; }
  .boot .hero { text-align: center; margin-bottom: 38px; }
  .boot .crest {
    width: 66px; height: 66px; margin: 0 auto 18px; display: grid; place-items: center;
    color: var(--accent); background: var(--accent-soft);
    border: 1px solid var(--accent-line); border-radius: var(--r-2xl);
    box-shadow: 0 0 28px var(--accent-glow);
  }
  .boot h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; letter-spacing: .06em; }
  .boot .sub { font-size: 13.5px; color: var(--text-2); margin-top: 6px; }
  .boot .cards { display: flex; flex-direction: column; gap: 8px; margin-bottom: 26px; }
  .boot .progress { display: flex; align-items: center; gap: 12px; }
  .boot .progress .pct { font-family: var(--font-hud); font-size: 12px; color: var(--text-2); min-width: 34px; text-align: right; }
</style>
</head>
<body>
  <div class="hud-backdrop"></div>
  <div class="system-pulse" data-state="busy"></div>

  <main class="boot">
    <div class="col">
      <div class="hero">
        <div class="crest">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3l7 3v5.5c0 4.6-3 7.8-7 9-4-1.2-7-4.4-7-9V6l7-3z"/>
            <path d="M9 12l2 2 4-4"/>
          </svg>
        </div>
        <h1>AEGIS</h1>
        <div class="sub">Richte deinen lokalen Schutz ein …</div>
      </div>

      <div class="cards">
        <!-- fertig -->
        <div class="status-card" data-state="done">
          <div class="well">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg>
          </div>
          <div class="meta"><div class="t">Sicherheits-Engine</div><div class="d">Aktiv · überwacht im Hintergrund</div></div>
          <div class="ind"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.2 2.2 4.8-4.8"/></svg></div>
        </div>
        <!-- fertig -->
        <div class="status-card" data-state="done">
          <div class="well">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3"/></svg>
          </div>
          <div class="meta"><div class="t">Bedrohungs-Modell</div><div class="d">Baseline geladen · 1.742 Programme gelernt</div></div>
          <div class="ind"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.2 2.2 4.8-4.8"/></svg></div>
        </div>
        <!-- aktiv -->
        <div class="status-card" data-state="active">
          <div class="well">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a4 4 0 00-4 4v1a3 3 0 00-2 5 3 3 0 002 5 4 4 0 008 0 3 3 0 002-5 3 3 0 00-2-5V7a4 4 0 00-4-4z"/><path d="M12 8v8"/></svg>
          </div>
          <div class="meta"><div class="t">Lokale KI</div><div class="d">Lade qwen3:8b …</div></div>
          <div class="ind"><svg class="spin" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3a9 9 0 109 9" opacity=".9"/></svg></div>
        </div>
        <!-- wartet -->
        <div class="status-card" data-state="waiting">
          <div class="well">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>
          </div>
          <div class="meta"><div class="t">Sprache</div><div class="d">Wartet …</div></div>
          <div class="ind"><div class="ring"></div></div>
        </div>
      </div>

      <div class="progress">
        <div class="bar" style="flex:1"><i style="width:55%"></i></div>
        <div class="pct">55%</div>
      </div>
    </div>
  </main>
</body>
</html>
